server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 游戏更新后立即生效，不做浏览器缓存
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
